# pyproject for telegram_recovery_v2
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recovery-v2"
version = "0.1.0"
description = "Self-contained Telegram recovery engine (A->archive->B) with real MTProto verification"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
recovery-v2 = "recovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
