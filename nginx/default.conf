# Telegram Archive & Migration Suite — reverse proxy
# Serves the React SPA and proxies /api to the FastAPI backend.
#
# For TLS: uncomment the 443 server block below and run certbot,
# see docs/deployment.md.

upstream backend_upstream {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Exports can be large; allow streaming without size limits.
    client_max_body_size 0;

    location /health {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

